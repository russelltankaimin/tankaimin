---
layout: default
title: Blog
permalink: /blog/
tags: blog
pagination:
  enabled: true
---

<div class="home">
  {% for post in paginator.posts %}
    <div class="post py3">
      <p class="post-meta">
        {{ post.date | date: "%b %-d, %Y" }}
      </p>

      <a href="{{ post.url | relative_url }}">
        <h3 class="h1 post-title">{{ post.title }}</h3>
      </a>

      <p class="post-summary">
        {{ post.summary | default: post.excerpt }}
      </p>
    </div>
  {% endfor %}

  {% include pagination.html %}
</div>
