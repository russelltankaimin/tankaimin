---
layout: page
title: Say Hello
permalink: /contact/
tags: contact
nav_label: contact
---

<div>
  {% if site.ajaxify_contact_form %}
    <form class="form">
      <label class="field">
        <span class="field__label">email</span>
        <input type="email" name="email" class="field__input" required autocomplete="email" placeholder="{{ site.text.contact.email | default: "Email Address" }}">
      </label>

      <label class="field">
        <span class="field__label">message</span>
        <textarea name="content" class="field__input" required rows="5" placeholder="{{ site.text.contact.content | default: "What would you like to say?" }}"></textarea>
      </label>

      <input type="text" name="_gotcha" style="display:none" />

      <button type='submit' class="btn">{{ site.text.contact.submit | default: "Say Hello" }}</button>
    </form>
  {% else %}
    <form action="https://formspree.io/{{ site.email }}" method="POST" class="form">
      <label class="field">
        <span class="field__label">email</span>
        <input type="email" name="email" class="field__input" required autocomplete="email" placeholder="{{ site.text.contact.email | default: "Email Address" }}">
      </label>
      <label class="field">
        <span class="field__label">message</span>
        <textarea name="content" class="field__input" required rows="5" placeholder="{{ site.text.contact.content | default: "What would you like to say?" }}"></textarea>
      </label>

      <input type="hidden" name="_next" value="{{ site.baseurl }}/thanks/" />
      <input type="hidden" name="_subject" value="{{ site.text.contact.subject | default: "New submission!" }}" />
      <input type="text" name="_gotcha" style="display:none" />

      <input type="submit" class="btn" value="{{ site.text.contact.submit | default: "Say Hello" }}">
    </form>
  {% endif %}
</div>

{% if site.ajaxify_contact_form %}
  {% include ajaxify_content_form.html %}
{% endif %}
