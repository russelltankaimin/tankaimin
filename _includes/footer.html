<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__motto">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M3 10 L10 3 L17 10 L10 17 Z M3 10 L17 10" fill="none" stroke="#c7bdf2" stroke-width="1.3"/>
        <circle cx="3" cy="10" r="1.9" fill="#7fb9ea"/><circle cx="10" cy="3" r="1.9" fill="#9c88ec"/>
        <circle cx="17" cy="10" r="1.9" fill="#7fb9ea"/><circle cx="10" cy="17" r="1.9" fill="#9c88ec"/>
      </svg>
      Transire suum pectus mundoque potiri
    </p>
    <div class="site-footer__links">
      {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}">github</a>{% endif %}
      <a href="{{ "/feed.xml" | relative_url }}">rss</a>
      <span>&copy; {{ site.time | date: "%Y" }}</span>
    </div>
  </div>
</footer>
{% if site.enable_anchorjs %}<!-- AnchorJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/3.0.0/anchor.min.js"></script>
<script>
    anchors.options.visible = 'always';
    anchors.add('.prose h2, .prose h3, .prose h4, .prose h5, .prose h6');
</script>{% endif %}
